<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Mahbuba ❤️</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;

  background:
    radial-gradient(
      circle at top,
      #8b5cf6,
      #4c1d95 45%,
      #16051f
    );

  color:white;
}

.container{
  width:92%;
  max-width:430px;

  max-height:94vh;
  overflow-y:auto;

  padding:28px 22px;

  text-align:center;

  border:1px solid rgba(255,255,255,.2);

  border-radius:28px;

  background:rgba(255,255,255,.12);

  backdrop-filter:blur(18px);

  box-shadow:
    0 20px 60px rgba(0,0,0,.35);
}

/* PHOTO */

.photo{
  width:115px;
  height:115px;

  object-fit:cover;

  border-radius:50%;

  border:4px solid rgba(255,255,255,.8);

  box-shadow:
    0 0 30px rgba(255,105,180,.7);

  margin-bottom:14px;
}

/* NAME */

h1{
  font-size:28px;
  margin-bottom:10px;
}

/* INTRO */

.intro{
  font-size:15px;

  line-height:1.7;

  opacity:.9;

  margin-bottom:22px;
}

/* MAIN QUESTION */

#message{
  min-height:75px;

  display:flex;

  justify-content:center;

  align-items:center;

  font-size:22px;

  font-weight:bold;

  line-height:1.5;

  margin-bottom:18px;
}

/* BUTTONS */

button{
  border:none;

  padding:13px 20px;

  border-radius:30px;

  cursor:pointer;

  font-size:16px;

  font-weight:bold;

  margin:5px;

  transition:.25s;
}

button:hover{
  transform:scale(1.06);
}

.yes{
  background:#22c55e;
  color:white;
}

.think{
  background:#f59e0b;
  color:white;
}

/* MUSIC */

.music-box{
  margin-top:25px;

  padding:16px;

  border-radius:20px;

  background:rgba(0,0,0,.18);
}

.music-title{
  font-size:14px;

  opacity:.85;

  margin-bottom:10px;
}

audio{
  width:100%;

  height:38px;
}

/* LYRICS */

.lyrics{
  margin-top:15px;

  min-height:52px;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:5px;

  font-size:17px;

  font-weight:bold;

  line-height:1.5;

  color:#ffe4f2;

  text-shadow:
    0 0 12px rgba(255,105,180,.8);

  transition:.3s;
}

/* FLOATING HEARTS */

.heart{
  position:fixed;

  bottom:-30px;

  font-size:20px;

  animation:
    float 7s linear infinite;

  opacity:.7;

  pointer-events:none;
}

@keyframes float{

  0%{
    transform:
      translateY(0)
      scale(.8);

    opacity:0;
  }

  15%{
    opacity:.8;
  }

  100%{
    transform:
      translateY(-110vh)
      scale(1.5);

    opacity:0;
  }
}

/* SCROLLBAR */

.container::-webkit-scrollbar{
  width:4px;
}

.container::-webkit-scrollbar-thumb{
  background:rgba(255,255,255,.3);
  border-radius:10px;
}

</style>
</head>


<body>


<div class="container">


  <!-- =========================
       PHOTO
  ========================== -->

  <img
    src="photo.jpg"
    class="photo"
    alt="Mahbuba"
  >


  <!-- =========================
       NAME
  ========================== -->

  <h1>
    Mahbuba ❤️
  </h1>


  <!-- =========================
       INTRO
  ========================== -->

  <div class="intro">

    কিছু কথা মুখে বলা যায় না...<br>

    তাই আজ একটু অন্যভাবে বলছি। 🫀

  </div>


  <!-- =========================
       QUESTION
  ========================== -->

  <div id="message">

    Will you be mine? ❤️

  </div>


  <!-- =========================
       BUTTONS
  ========================== -->

  <div>

    <button
      class="yes"
      onclick="yesWhatsApp()"
    >

      💖 Yes, I choose you

    </button>


    <button
      class="think"
      onclick="thinkWhatsApp()"
    >

      🙈 Let me think

    </button>

  </div>


  <!-- =========================
       MUSIC + LYRICS
  ========================== -->

  <div class="music-box">


    <div class="music-title">

      🎵 A little song for you...

    </div>


    <audio
      id="song"
      controls
    >

      <source
        src="song.mp3"
        type="audio/mpeg"
      >

      Your browser does not support audio.

    </audio>


    <!-- LYRICS -->

    <div
      id="lyrics"
      class="lyrics"
    >

      🎶 গান শুরু হলে লিরিক্স এখানে আসবে...

    </div>


  </div>


</div>



<script>


/* =====================================
   WHATSAPP
===================================== */


const phone =
  "8801609223346";


function yesWhatsApp(){


  alert(

    "💖 You chose me!\n\n" +

    "তোমার উত্তরটা সত্যিই অনেক বিশেষ। ❤️"

  );


  const message =

    "Yes, I choose you ❤️";


  window.location.href =

    "https://wa.me/" +

    phone +

    "?text=" +

    encodeURIComponent(message);

}



function thinkWhatsApp(){


  alert(

    "🙈 Take your time...\n\n" +

    "তাড়াহুড়ো নেই, সময় নিয়ে ভাবো। ❤️"

  );


  const message =

    "Let me think 🙈";


  window.location.href =

    "https://wa.me/" +

    phone +

    "?text=" +

    encodeURIComponent(message);

}



/* =====================================
   LYRICS
===================================== */


const lyrics = [


  {
    time:0,
    text:"Main likh doon aasmaan par ye"
  },


  {
    time:11,
    text:"Ke padh lega jahaan saara"
  },


  {
    time:15,
    text:"Huaa na hoga ab koi"
  },


  {
    time:18,
    text:"Yahan hum do sa dobara"
  },


  {
    time:21,
    text:"Main duniya bhar ki taarifein"
  },


  {
    time:24,
    text:"Tere sajde mein laaya hoon"
  },


  {
    time:27,
    text:"Main tumse ishq karne ki"
  },


  {
    time:30,
    text:"Ijaazat Rab se laaya hoon ❤️"
  }

];


const song =
  document.getElementById("song");


const lyricsBox =
  document.getElementById("lyrics");


song.addEventListener(
  "timeupdate",

  function(){


    const currentTime =
      song.currentTime;


    let active = null;


    for(
      let i = 0;
      i < lyrics.length;
      i++
    ){


      if(
        currentTime >=
        lyrics[i].time
      ){

        active =
          lyrics[i];

      }

    }


    if(active){

      lyricsBox.innerHTML =
        active.text;

    }

  }

);



/* =====================================
   FLOATING HEARTS
===================================== */


function createHeart(){


  const heart =
    document.createElement("div");


  heart.className =
    "heart";


  const hearts = [

    "❤️",
    "💜",
    "💗",
    "💕",
    "💖",
    "✨"

  ];


  heart.innerHTML =
    hearts[
      Math.floor(
        Math.random() *
        hearts.length
      )
    ];


  heart.style.left =
    Math.random() *
    100 +
    "vw";


  heart.style.animationDuration =
    5 +
    Math.random() * 5 +
    "s";


  heart.style.fontSize =
    14 +
    Math.random() * 18 +
    "px";


  document.body.appendChild(
    heart
  );


  setTimeout(

    () => heart.remove(),

    10000

  );

}


setInterval(
  createHeart,
  700
);


</script>

</body>
</html>
