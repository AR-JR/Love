<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Mahbuba ❤️</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  background:
    radial-gradient(circle at top,#8b5cf6,#4c1d95 45%,#16051f);
  color:white;
}

.container{
  width:92%;
  max-width:430px;
  padding:28px 22px;
  text-align:center;
  border:1px solid rgba(255,255,255,.2);
  border-radius:28px;
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(18px);
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.photo{
  width:115px;
  height:115px;
  object-fit:cover;
  border-radius:50%;
  border:4px solid rgba(255,255,255,.8);
  box-shadow:0 0 30px rgba(255,105,180,.7);
  margin-bottom:14px;
}

h1{
  font-size:28px;
  margin-bottom:10px;
}

.intro{
  font-size:15px;
  line-height:1.7;
  opacity:.9;
  margin-bottom:25px;
}

#message{
  min-height:72px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:21px;
  font-weight:bold;
  line-height:1.5;
  margin-bottom:20px;
}

button{
  border:none;
  padding:13px 22px;
  border-radius:30px;
  cursor:pointer;
  font-size:16px;
  font-weight:bold;
  margin:5px;
  transition:.25s;
}

button:hover{
  transform:scale(1.06);
}

#nextBtn{
  background:white;
  color:#6d28d9;
}

.yes{
  background:#22c55e;
  color:white;
}

.think{
  background:#f59e0b;
  color:white;
}

.music-box{
  margin-top:24px;
  padding:16px;
  border-radius:20px;
  background:rgba(0,0,0,.18);
}

.music-title{
  font-size:14px;
  opacity:.8;
  margin-bottom:8px;
}

audio{
  width:100%;
  height:38px;
}

.lyrics{
  margin-top:15px;
  min-height:50px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:17px;
  font-weight:bold;
  color:#ffe4f2;
  text-shadow:0 0 12px rgba(255,105,180,.8);
  transition:.3s;
}

.heart{
  position:fixed;
  bottom:-30px;
  font-size:20px;
  animation:float 7s linear infinite;
  opacity:.7;
  pointer-events:none;
}

@keyframes float{
  0%{
    transform:translateY(0) scale(.8);
    opacity:0;
  }
  15%{opacity:.8}
  100%{
    transform:translateY(-110vh) scale(1.5);
    opacity:0;
  }
}

.hidden{
  display:none;
}
</style>
</head>

<body>

<div class="container">

  <img src="photo.jpg" class="photo" alt="Mahbuba">

  <h1>Mahbuba ❤️</h1>

  <div class="intro">
    কিছু কথা মুখে বলা যায় না...<br>
    তাই আজ একটু অন্যভাবে বলছি। 🫀
  </div>

  <div id="message">
    তোমার সাথে আমার গল্পটা কি একটু অন্যরকম হতে পারে? 🌸
  </div>

  <div id="buttons">
    <button id="nextBtn" onclick="nextMessage()">একটু এগিয়ে আসো... 💜</button>
  </div>

  <div class="music-box">
    <div class="music-title">🎵 আমাদের কথাগুলোর সাথে একটু গান...</div>

    <audio id="song" controls>
      <source src="song.mp3" type="audio/mpeg">
      তোমার ব্রাউজার অডিও সাপোর্ট করে না।
    </audio>

    <div id="lyrics" class="lyrics">
      🎶 গান শুরু হলে লিরিক্স এখানে আসবে...
    </div>
  </div>

</div>

<script>

const messages = [

  "তোমার সাথে আমার গল্পটা কি একটু অন্যরকম হতে পারে? 🌸",

  "কিছু মানুষ জীবনে আসে... আর আসার পর সবকিছু একটু সুন্দর লাগে। ✨",

  "তুমি ঠিক তেমনই একজন।",

  "তোমার সাথে কথা বললে সময়টা কোথায় চলে যায়, বুঝতেই পারি না। 🫀",

  "Maybe you don't know... but you became a very special part of my thoughts. 💫",

  "তোমাকে নিয়ে আমার কথাগুলো যতটা বলা যায়, অনুভূতিটা তার থেকেও বেশি।",

  "So today, I just want to ask you something... ❤️",

  "তুমি কি আমার এই ছোট্ট গল্পটার সবচেয়ে সুন্দর অধ্যায় হবে? 🥹",

  "তাহলে... আমার এই অনুভূতিটাকে কি একটু জায়গা দেবে? 💜"

];

let current = 0;

function nextMessage(){

  current++;

  if(current < messages.length){

    document.getElementById("message").innerHTML =
      messages[current];

    if(current === messages.length - 1){

      document.getElementById("buttons").innerHTML = `

        <button class="yes" onclick="sayYes()">
          Yes ❤️
        </button>

        <button class="think" onclick="think()">
          Let me think 🙈
        </button>

      `;
    }

  }

}

function sayYes(){

  const text =
    "Mahbuba ❤️ আমি জানি না এই মুহূর্তটাকে কীভাবে সুন্দর করে বলব... শুধু জানি, তোমার উত্তরটা আমার কাছে অনেক বিশেষ। 🫀✨";

  const url =
    "https://wa.me/8801609223346?text=" +
    encodeURIComponent(text);

  window.open(url,"_blank");
}

function think(){

  alert(
    "ঠিক আছে 🙈 সময় নিয়ে ভাবো... তবে একটা কথা মনে রেখো, এই প্রশ্নটা সত্যি মন থেকেই করা। ❤️"
  );

}


/* =========================
   LYRICS SYSTEM
========================= */

const lyrics = [

  {
    time:0,
    text:"Main likh doon aasmaan par ye"
  },

  {
    time:12,
    text:"Ke padh lega jahaan saara"
  },

  {
    time:15,
    text:"Huaa na hoga ab koi"
  },

  {
    time:18,
    text:"Yahan hum do sa dobara"
  },

  {
    time:23,
    text:"Main duniya bhar ki taarifein"
  },

  {
    time:26,
    text:"Tere sajde mein laaya hoon"
  },

  {
    time:30,
    text:"Main tumse ishq karne ki"
  },

  {
    time:33,
    text:"Ijaazat, Rab se laaya hoon ❤️"
  }

];

const song = document.getElementById("song");
const lyricsBox = document.getElementById("lyrics");

song.addEventListener("timeupdate", function(){

  const currentTime = song.currentTime;

  let active = null;

  for(let i = 0; i < lyrics.length; i++){

    if(currentTime >= lyrics[i].time){
      active = lyrics[i];
    }

  }

  if(active){

    lyricsBox.innerHTML = active.text;

  }

});


/* =========================
   FLOATING HEARTS
========================= */

function createHeart(){

  const heart = document.createElement("div");

  heart.className = "heart";

  heart.innerHTML =
    ["❤️","💜","💗","💕","💖","✨"]
    [Math.floor(Math.random()*6)];

  heart.style.left =
    Math.random()*100 + "vw";

  heart.style.animationDuration =
    (5 + Math.random()*5) + "s";

  heart.style.fontSize =
    (14 + Math.random()*18) + "px";

  document.body.appendChild(heart);

  setTimeout(()=>{
    heart.remove();
  },10000);

}

setInterval(createHeart,700);

</script>

</body>
</html>
